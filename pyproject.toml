[project]
name = "home-prj"
version = "0.1.0"
description = ""
authors = [
    {name = "Roman_Soldatov",email = "soldatov.rom4ik@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests (>=2.32.5,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "mypy (>=1.19.1,<2.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=25.12.0,<26.0.0)",
    "isort (>=7.0.0,<8.0.0)"
]
dev = [
    "requests (>=2.32.5,<3.0.0)"
]

[tool.mypy]
warn_return_any = true
no_implicit_optional = true
disallow_untyped_defs = true
exclude = 'venv'

[tool.black]
# Максимальная длина строки
line-length = 119
# Файлы, которые не нужно форматировать
exclude = "'.direnv', '.eggs', '.git', '.mypy_cache', '.pytest_cache',  '.venv', '.vscode', '__pypackages__', 'venv'"

[tool.isort]
# максимальная длина строки
line_length = 119